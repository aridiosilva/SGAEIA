name: Bug report
description: Report a reproducible defect in the reference implementation or tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities or secrets here. Use SECURITY.md for security-sensitive reports."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, commands, configuration, and inputs needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SGAEIA version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, deployment profile, and relevant adapter versions.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain a vulnerability, credential, secret, personal data, or sensitive exploit detail.
          required: true
