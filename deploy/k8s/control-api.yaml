apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgaeia-control-api
  namespace: sgaeia
spec:
  replicas: 2
  selector:
    matchLabels: {app: sgaeia-control-api}
  template:
    metadata:
      labels: {app: sgaeia-control-api}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: REPLACE_WITH_SIGNED_IMAGE
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: sgaeia-control-api
  namespace: sgaeia
spec:
  selector: {app: sgaeia-control-api}
  ports: [{port: 80, targetPort: 8080}]
