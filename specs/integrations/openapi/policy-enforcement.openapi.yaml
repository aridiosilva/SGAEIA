openapi: 3.2.0
info:
  title: SGAEIA Policy Enforcement Port
  version: 1.0.0
  description: Vendor-neutral SGAEIA Integration Port contract. Adapter implementations
    SHALL preserve functional, security, audit, failure and revocation semantics.
paths:
  /v1/enforcement/enforce:
    post:
      summary: Enforce a previously evaluated decision
      operationId: policy_enforcement_enforce_a_previously_evaluated_decision
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
