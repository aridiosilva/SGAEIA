openapi: 3.2.0
info:
  title: SGAEIA Policy Decision Port
  version: 1.0.0
  description: Vendor-neutral SGAEIA Integration Port contract. Adapter implementations
    SHALL preserve functional, security, audit, failure and revocation semantics.
paths:
  /v1/decision/evaluate:
    post:
      summary: Evaluate authorization policy
      operationId: policy_decision_evaluate_authorization_policy
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
