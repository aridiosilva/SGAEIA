openapi: 3.2.0
info:
  title: SGAEIA Dynamic Risk Port
  version: 1.0.0
  description: Vendor-neutral SGAEIA Integration Port contract. Adapter implementations
    SHALL preserve functional, security, audit, failure and revocation semantics.
paths:
  /v1/risk/score:
    post:
      summary: Score runtime risk
      operationId: risk_engine_score_runtime_risk
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
