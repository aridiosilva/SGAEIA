openapi: 3.2.0
info:
  title: SGAEIA Governed Registry Port
  version: 1.0.0
  description: Vendor-neutral SGAEIA Integration Port contract. Adapter implementations
    SHALL preserve functional, security, audit, failure and revocation semantics.
paths:
  /v1/entities:
    post:
      summary: Register a governed entity
      operationId: registry_register_a_governed_entity
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              additionalProperties: true
  /v1/entities/{entity_id}:
    get:
      summary: Read a governed entity
      operationId: registry_read_a_governed_entity
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
  /v1/entities/{entity_id}/revoke:
    post:
      summary: Revoke a governed entity
      operationId: registry_revoke_a_governed_entity
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
