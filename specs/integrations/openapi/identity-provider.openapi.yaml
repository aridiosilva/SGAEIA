openapi: 3.2.0
info:
  title: SGAEIA Workload Identity Port
  version: 1.0.0
  description: Vendor-neutral SGAEIA Integration Port contract. Adapter implementations
    SHALL preserve functional, security, audit, failure and revocation semantics.
paths:
  /v1/identity/verify:
    post:
      summary: Verify a workload identity
      operationId: identity_provider_verify_a_workload_identity
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              type: object
              additionalProperties: true
  /v1/identity/revoke:
    post:
      summary: Revoke a workload identity
      operationId: identity_provider_revoke_a_workload_identity
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /v1/identity/attest:
    post:
      summary: Return attestation/trust state
      operationId: identity_provider_return_attestation_trust_state
      responses:
        '200':
          description: Operation completed
        '400':
          description: Invalid request
        '401':
          description: Unauthenticated
        '403':
          description: Denied
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
